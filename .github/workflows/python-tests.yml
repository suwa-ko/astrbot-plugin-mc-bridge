name: Python Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests in pinned AstrBot image
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            --entrypoint sh \
            soulter/astrbot:v4.29.4 \
            -c 'python -m pip install -r astrbot_plugin_mc_bridge/requirements.txt && MC_PLUGIN_FILE=/workspace/astrbot_plugin_mc_bridge/main.py python -m unittest discover -s tests -v'
