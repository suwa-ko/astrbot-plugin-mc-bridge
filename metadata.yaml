name: astrbot_plugin_mc_bridge
display_name: Minecraft 生存助手
short_desc: 让 AI 在真实的 Minecraft 世界里采集、建造、战斗和完成生存任务。
desc: |
  把自然语言指令变成真实的 Minecraft 行动。AI 会观察周围环境、使用当前背包里的物品，并在任务结束后按实际结果回复。

  支持采集木材、矿石和作物，合成工具、烧炼材料、整理箱子，以及建造、耕种、战斗、睡觉、探索和回家。多步骤任务可以查看进度、取消，并在完成后主动通知；低血量、敌人靠近或目标不可达时会自动停下。可登记建筑和容器保护，并限制单次/单任务破坏预算。

  记忆升级：地点坐标保存在本地结构化库，模型只看到不透明地点句柄；精确坐标只在主人私聊由本地卡片显示。LivingMemory、嵌入和旧文档检索使用脱敏内容；白名单群永久只读。

  需要配合 NeoForge 客户端 Mod 使用，适用于单人世界和允许客户端操作的服务器。
version: 1.5.13
author: suwa-ko
repo: https://github.com/suwa-ko/astrbot-plugin-mc-bridge
astrbot_version: ">=4.16,<5"
