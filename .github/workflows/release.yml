name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew assemble bridgeRegression navigationRegression survivalRegression --no-daemon

      - name: Package plugin
        run: |
          zip -r "astrbot_plugin_mc_bridge-${GITHUB_REF_NAME}.zip" astrbot_plugin_mc_bridge
          sha256sum "astrbot_plugin_mc_bridge-${GITHUB_REF_NAME}.zip" mod/build/libs/astrbot_bridge-*.jar > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            astrbot_plugin_mc_bridge-${{ github.ref_name }}.zip
            mod/build/libs/astrbot_bridge-*.jar
            checksums.txt
          generate_release_notes: true
