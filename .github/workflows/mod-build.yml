name: Mod Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build and run Java regressions
        run: |
          for attempt in 1 2 3; do
            ./gradlew assemble bridgeRegression navigationRegression survivalRegression --no-daemon && exit 0
            echo "Gradle attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Upload Mod jar
        uses: actions/upload-artifact@v4
        with:
          name: astrbot-bridge-mod
          path: mod/build/libs/astrbot_bridge-*.jar
          if-no-files-found: error
